<!DOCTYPE html>
<html>
<head>
    <title>Reset Password - StockNova Inventory</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #0a0a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {    
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
        }
        .logo {
            text-align: center;
            font-size: 48px;
            margin-bottom: 10px;
        }
        h2 {
            text-align: center;
            color: white;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 500;
            margin-bottom: 6px;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 15px;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }
        .password-wrapper {
            position: relative;
        }
        .password-wrapper input {
            width: 100%;
            padding: 14px 46px 14px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 15px;
        }
        .password-wrapper input:focus {
            outline: none;
            border-color: #667eea;
        }
        .password-wrapper input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }
        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: rgba(255, 255, 255, 0.4);
            font-size: 18px;
            transition: color 0.3s;
        }
        .toggle-password:hover {
            color: rgba(255, 255, 255, 0.8);
        }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.4);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .error {
            background: rgba(245, 87, 108, 0.1);
            border: 1px solid rgba(245, 87, 108, 0.2);
            border-radius: 10px;
            padding: 12px;
            color: #f5576c;
            text-align: center;
            margin-bottom: 15px;
            display: none;
            font-size: 14px;
        }
        .success {
            background: rgba(46, 213, 115, 0.1);
            border: 1px solid rgba(46, 213, 115, 0.2);
            border-radius: 10px;
            padding: 12px;
            color: #2ed573;
            text-align: center;
            margin-bottom: 15px;
            display: none;
            font-size: 14px;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
        }
        .footer a {
            color: #667eea;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
        .back-link {
            display: inline-block;
            color: rgba(255, 255, 255, 0.3);
            text-decoration: none;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .back-link:hover {
            color: white;
        }
        .password-hint {
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
            margin-top: 4px;
        }
        .user-info {
            background: rgba(102, 126, 234, 0.08);
            border: 1px solid rgba(102, 126, 234, 0.15);
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 20px;
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
        }
        .user-info strong {
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/login" class="back-link">← Back to Login</a>
        <div class="logo">🔐</div>
        <h2>Reset Password</h2>
        <p class="subtitle">Enter your new password</p>

        <div id="userInfo" class="user-info">
            👤 Resetting password for: <strong id="displayUsername">Loading...</strong>
        </div>

        <div id="error" class="error"></div>
        <div id="success" class="success"></div>

        <form id="resetForm">
            <div class="form-group">
                <label>New Password</label>
                <div class="password-wrapper">
                    <input type="password" id="newPassword" placeholder="Min 6 characters" required minlength="6">
                    <span class="toggle-password" onclick="togglePassword('newPassword', this)">
                        <i class="fas fa-eye"></i>
                    </span>
                </div>
                <div class="password-hint">Password must be at least 6 characters</div>
            </div>
            <div class="form-group">
                <label>Confirm New Password</label>
                <div class="password-wrapper">
                    <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
                    <span class="toggle-password" onclick="togglePassword('confirmPassword', this)">
                        <i class="fas fa-eye"></i>
                    </span>
                </div>
            </div>

            <button type="submit" class="btn" id="resetBtn">Reset Password</button>
        </form>

        <div class="footer">
            Remember your password? <a href="/login">Login</a>
        </div>
    </div>

    <script>
        // ============================================
        // GET USERNAME FROM URL
        // ============================================
        const urlParams = new URLSearchParams(window.location.search);
        const username = urlParams.get('username');

        // ============================================
        // DISPLAY USERNAME
        // ============================================
        if (username) {
            document.getElementById('displayUsername').textContent = username;
        } else {
            document.getElementById('displayUsername').textContent = 'Unknown User';
            // Redirect to login if no username
            setTimeout(function() {
                window.location.href = '/login';
            }, 2000);
        }

        // ============================================
        // TOGGLE PASSWORD VISIBILITY
        // ============================================
        function togglePassword(inputId, element) {
            var input = document.getElementById(inputId);
            var icon = element.querySelector('i');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }

        // ============================================
        // RESET FORM SUBMIT
        // ============================================
        document.getElementById('resetForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorDiv = document.getElementById('error');
            const successDiv = document.getElementById('success');
            const resetBtn = document.getElementById('resetBtn');

            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';

            if (newPassword.length < 6) {
                errorDiv.textContent = '❌ Password must be at least 6 characters';
                errorDiv.style.display = 'block';
                return;
            }

            if (newPassword !== confirmPassword) {
                errorDiv.textContent = '❌ Passwords do not match';
                errorDiv.style.display = 'block';
                return;
            }

            if (!username) {
                errorDiv.textContent = '❌ Username not found. Please try again.';
                errorDiv.style.display = 'block';
                return;
            }

            resetBtn.disabled = true;
            resetBtn.textContent = 'Resetting...';

            try {
                const response = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: username,
                        new_password: newPassword
                    })
                });

                const data = await response.json();

                if (data.success) {
                    successDiv.textContent = '✅ ' + data.message + ' Redirecting to login...';
                    successDiv.style.display = 'block';
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                } else {
                    errorDiv.textContent = '❌ ' + (data.message || 'Reset failed');
                    errorDiv.style.display = 'block';
                    resetBtn.disabled = false;
                    resetBtn.textContent = 'Reset Password';
                }
            } catch (error) {
                errorDiv.textContent = '❌ Network error. Please try again.';
                errorDiv.style.display = 'block';
                resetBtn.disabled = false;
                resetBtn.textContent = 'Reset Password';
            }
        });
    </script>
</body>
</html>
