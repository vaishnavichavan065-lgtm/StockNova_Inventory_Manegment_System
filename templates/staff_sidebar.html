        StockNova<span>.</span>
    </div>

    <div class="menu-label">Main</div>
    <a href="/dashboard" class="menu-item" id="navDashboard">
        <i class="fas fa-th-large"></i> Dashboard
    </a>
    <a href="/products" class="menu-item" id="navProducts">
        <i class="fas fa-boxes"></i> Products
    </a>
    <a href="/suppliers" class="menu-item" id="navSuppliers">
        <i class="fas fa-building"></i> Suppliers
    </a>
    <a href="/sales-report" class="menu-item" id="navSales">
        <i class="fas fa-chart-line"></i> Sales
    </a>

    <div class="menu-label">Account</div>
    <a href="/profile" class="menu-item" id="navProfile">
        <i class="fas fa-user-circle"></i> Profile
    </a>
    <a href="/settings" class="menu-item" id="navSettings">
        <i class="fas fa-cog"></i> Settings
    </a>

    <button class="logout-btn" onclick="logout()">
        <i class="fas fa-sign-out-alt"></i> Logout
    </button>
</div>

<script>
    // ===== HIGHLIGHT ACTIVE MENU =====
    document.addEventListener('DOMContentLoaded', function() {
        var currentPath = window.location.pathname;
        document.querySelectorAll('.sidebar .menu-item').forEach(function(item) {
            var href = item.getAttribute('href');
            if (href && currentPath.includes(href)) {
                item.classList.add('active');
            }
            if (currentPath === '/dashboard' && href === '/dashboard') {
                item.classList.add('active');
            }
        });
    });

    // ===== LOGOUT =====
    function logout() {
        if (confirm('Are you sure you want to logout?')) {
            fetch('/api/logout', { method: 'POST' })
                .then(function() { window.location.href = '/login'; })
                .catch(function() { window.location.href = '/login'; });
        }
    }
</script>
