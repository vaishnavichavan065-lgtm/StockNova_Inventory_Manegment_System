<!DOCTYPE html>
<html>
<head>
    <title>Login - StockNova Inventory</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #0a0a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {    
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
        }
        .logo {
            text-align: center;
            font-size: 48px;
            margin-bottom: 10px;
        }
        h2 {
            text-align: center;
            color: white;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            margin-bottom: 25px;
        }
        .login-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 4px;
        }
        .login-tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s;
            background: transparent;
            color: rgba(255, 255, 255, 0.4);
            font-family: Arial, sans-serif;
        }
        .login-tab.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        .login-tab:hover {
            color: white;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 500;
            margin-bottom: 6px;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 15px;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }
        .password-wrapper {
            position: relative;
        }
        .password-wrapper input {
            width: 100%;
            padding: 14px 46px 14px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 15px;
        }
        .password-wrapper input:focus {
            outline: none;
            border-color: #667eea;
        }
        .password-wrapper input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }
        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: rgba(255, 255, 255, 0.4);
            font-size: 18px;
            transition: color 0.3s;
        }
        .toggle-password:hover {
            color: rgba(255, 255, 255, 0.8);
        }
        .forgot-link {
            text-align: right;
            margin-bottom: 18px;
        }
        .forgot-link a {
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
            text-decoration: none;
            transition: color 0.3s;
        }
        .forgot-link a:hover {
            color: #667eea;
        }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.4);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .error {
            background: rgba(245, 87, 108, 0.1);
            border: 1px solid rgba(245, 87, 108, 0.2);
            border-radius: 10px;
            padding: 12px;
            color: #f5576c;
            text-align: center;
            margin-bottom: 15px;
            display: none;
            font-size: 14px;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
        }
        .footer a {
            color: #667eea;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
        .back-link {
            display: inline-block;
            color: rgba(255, 255, 255, 0.3);
            text-decoration: none;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .back-link:hover {
            color: white;
        }
        .type-badge {
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 15px;
            width: 100%;
        }
        .badge-admin {
            background: rgba(102, 126, 234, 0.15);
            color: #667eea;
        }
        .badge-staff {
            background: rgba(240, 147, 251, 0.15);
            color: #f093fb;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">← Back</a>
        <div class="logo">📦</div>
        <h2>Welcome Back</h2>
        <p class="subtitle">Login to manage your inventory</p>

        <div id="typeBadge" class="type-badge"></div>

        <!-- Login Tabs -->
        <div class="login-tabs">
            <button class="login-tab" data-type="staff" onclick="switchTab('staff')">
                👤 Staff
            </button>
            <button class="login-tab" data-type="admin" onclick="switchTab('admin')">
                🔑 Admin
            </button>
        </div>

        <div id="error" class="error"></div>

        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Enter password" required>
                    <span class="toggle-password" onclick="togglePassword('password', this)">
                        <i class="fas fa-eye"></i>
                    </span>
                </div>
            </div>

            <!-- Forgot Password Link -->
            <div class="forgot-link">
                <a href="#" onclick="forgotPassword()">Forgot Password?</a>
            </div>

            <button type="submit" class="btn" id="loginBtn">Login</button>
        </form>

        <div class="footer">
            Don't have an account? <a href="/signup">Sign Up</a>
        </div>
    </div>

    <script>
        let currentLoginType = 'staff';

        // ===== Get URL Parameter =====
        const urlParams = new URLSearchParams(window.location.search);
        const typeParam = urlParams.get('type');

        if (typeParam === 'admin') {
            currentLoginType = 'admin';
        } else if (typeParam === 'staff') {
            currentLoginType = 'staff';
        }

        // ===== Switch Tab =====
        function switchTab(type) {
            currentLoginType = type;
            document.querySelectorAll('.login-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.type === type);
            });
            document.getElementById('typeBadge').textContent = type === 'admin' ? '🔑 Admin Login' : '👤 Staff Login';
            document.getElementById('typeBadge').className = 'type-badge ' + (type === 'admin' ? 'badge-admin' : 'badge-staff');
            document.getElementById('error').style.display = 'none';
        }

        // ===== Set Initial Tab =====
        switchTab(currentLoginType);

        // ============================================
        // TOGGLE PASSWORD VISIBILITY
        // ============================================
        function togglePassword(inputId, element) {
            var input = document.getElementById(inputId);
            var icon = element.querySelector('i');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }

        // ============================================
        // FORGOT PASSWORD - Username वाला
        // ============================================
        function forgotPassword() {
            var username = prompt('👤 Enter your username to reset password:');
            
            if (username && username.trim() !== '') {
                // First verify username exists
                fetch('/api/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username.trim() })
                })
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    if (data.success) {
                        // Username verified - go to reset page
                        window.location.href = '/reset-password?username=' + encodeURIComponent(username.trim());
                    } else {
                        alert('❌ ' + (data.message || 'Username not found. Please check your username.'));
                    }
                })
                .catch(function(e) {
                    alert('❌ Network error. Please try again.');
                });
            }
        }

        // ============================================
        // LOGIN FORM SUBMIT
        // ============================================
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');
            const loginBtn = document.getElementById('loginBtn');

            errorDiv.style.display = 'none';
            loginBtn.disabled = true;
            loginBtn.textContent = 'Logging in...';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: username,
                        password: password,
                        login_type: currentLoginType
                    })
                });

                const data = await response.json();

                if (data.success) {
                    window.location.href = '/dashboard';
                } else {
                    errorDiv.textContent = data.message || 'Login failed';
                    errorDiv.style.display = 'block';
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Login';
                }
            } catch (error) {
                errorDiv.textContent = 'Network error. Please try again.';
                errorDiv.style.display = 'block';
                loginBtn.disabled = false;
                loginBtn.textContent = 'Login';
            }
        });

        
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
